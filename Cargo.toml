[package]
name = "nostr-minions"
version = "0.1.24"
edition = "2021"
license = "BSD-3-Clause"
description = "A Yew-based framework for client side Nostr apps"
repository = "https://github.com/illuminodes/minions"
readme = "README.md"
homepage = "https://github.com/illuminodes/minions"

[dependencies]

[lib]
crate-type = ["cdylib"]

# A separate binary for the WASM service worker
[[bin]]
name = "service_worker"
path = "src/sw.rs"

# Nostr Stack
nostro2 = "0.3.9"
nostro2-signer = "0.1.11"
# nostro2 = { path = "../NostrO2/nostro2" }
# nostro2-signer = { path = "../NostrO2/nostro2-signer" }

# JSON manipulation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"

# DOM and Browser Bindings
web-sys = { version = "0.3", features = [ "SubtleCrypto", "CryptoKey", "Window", "Crypto", "AesKeyGenParams", "AesGcmParams",  
"Clipboard", "Navigator", "Response", "ReadableStream", "Navigator", "ServiceWorkerContainer", "ServiceWorkerGlobalScope", 
"FetchEvent", "CustomEvent", "DomStringList"] }

# I/O
wasm-bindgen-futures = "0.4"

# PWA stack
yew = { version = "0.21.0" }
wasm-bindgen = "0.2"
idb = "0.6.4"
thiserror = "2.0.16"

