[package]
name = "test_app"
version = "0.1.0"
edition = "2021"

[dependencies]
gloo-timers = "0.3.0"
yew = { version = "0.23.0",  features = ["csr"] }
# `sab-transport` is ON here on purpose: this app is what exercises the shared
# ring path. The feature only makes the path AVAILABLE; the pool still probes
# `crossOriginIsolated` at runtime, so serving without the COOP/COEP headers in
# `Trunk.toml` silently tests the JSON bridge instead. The transport banner in
# the UI states which one actually won.
nostr-minions = { path = "../", features = ["sab-transport"] }
web-sys = "0.3"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
