[package]
name = "worker_bench"
version = "0.1.0"
edition = "2021"
publish = false

# Two bins:
#  - `app`    : the main UI module. ALSO hosts the shared-memory ring worker
#               entry (`ring_worker_main`, a #[wasm_bindgen] export); that
#               worker runs THIS same module against the same WebAssembly.Memory
#               (shared memory), spawned at runtime from src/shared.rs.
#  - `worker` : a SEPARATE module for the yew-agent Reactor path (its own,
#               non-shared memory — that's the postMessage-bridge model we're
#               benchmarking against). Built with the same atomics flags, which
#               it simply doesn't exercise.
[[bin]]
name = "app"
path = "src/app.rs"

[[bin]]
name = "worker"
path = "src/worker.rs"

[dependencies]
# The library under test. `bench-harness` exposes the synthetic flood on the
# REAL reactor, so this bench drives the shipped ingestion path — there is no
# second copy of it here to drift out of sync.
nostr-minions = { path = "../", features = ["bench-harness"] }

yew = { version = "0.23.0", features = ["csr"] }
yew-agent = "0.5.0"

# nostro2 note/filter types travel across the worker boundary; they are
# already Serialize/Deserialize. We depend on it directly so the worker and
# app agree on the exact same types (re-exported by nostr-minions too).
nostro2 = { version = "0.8", default-features = false }

# Lock-free ring buffer used for zero-copy IPC across the shared-memory worker
# boundary (raw-pointer handle seam added in 0.11.x+). Local path during the
# spike; publish + switch to a version dep once proven.
quetzalcoatl = { path = "../../../tooling/quetzalcoatl" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent",
    "Window", "Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope",
    "Crypto", "Performance", "Blob", "BlobPropertyBag", "Url",
] }
